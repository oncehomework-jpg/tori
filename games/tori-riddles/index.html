<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#e8d8b8">
  <meta name="robots" content="noindex,nofollow">
  <title>부엉박사의 수수께끼 찻집</title>
  <link rel="icon" href="../../icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="preview-label">부엉박사의 수수께끼 찻집 <span>120문제</span></div>
  <p id="storage-warning" class="storage-warning" role="alert" hidden>수수께끼 진행을 저장하지 못했어요. 이 창을 닫기 전에 저장 공간과 앱 상태를 확인해 주세요.</p>
  <div class="shell">
    <header class="topbar"><button class="quiet" data-action="close-app">돌아가기</button><button class="quiet sound" data-action="sound" id="sound" aria-pressed="false">소리 꺼짐</button></header>
    <main id="main" tabindex="-1"></main>
  </div>
  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-description"><div class="dialog-content"><p class="eyebrow">잠깐만요</p><h2 id="confirm-title"></h2><p id="confirm-description"></p><div class="dialog-actions"><button id="confirm-cancel" class="secondary">계속 풀기</button><button id="confirm-yes" class="primary"></button></div></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p>수수께끼를 풀려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
  <script src="../../js/pixel-icons.js"></script>
  <script src="riddles.js"></script>
  <script src="legacy-riddles.js"></script>
  <script src="engine.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
